<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Будьте внимательны! Регистрация не требуется</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&family=Nunito:wght@900&display=swap">
<style>
  :root {
    --violet: #8875E8;
    --lavender: #B3AEFF;
    --display: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    color: var(--violet);
    font-family: var(--body);
    overflow-x: hidden;
  }
  .page {
    position: relative;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px clamp(150px, 24vw, 320px);
    box-sizing: border-box;
    text-align: center;
  }
  .content { display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 3vw, 36px); max-width: 60rem; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(2.4rem, 7.4vw, 5.6rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  p {
    margin: 0;
    font-weight: 500;
    font-size: clamp(1.05rem, 1.9vw, 1.5rem);
    line-height: 1.45;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: clamp(8px, 2vw, 24px);
    color: var(--violet);
    font-size: clamp(1.05rem, 1.9vw, 1.5rem);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .back:hover { text-decoration-thickness: 2.5px; }
  .back:focus-visible { outline: 2px solid var(--lavender); outline-offset: 2px; }
  .back svg { width: 1em; height: 1em; flex: none; }
  .blocks { position: absolute; bottom: 0; display: block; pointer-events: none; }
  .left { left: 0; width: clamp(180px, 33vw, 434px); }
  .right { right: 0; width: clamp(130px, 24vw, 312px); }
</style>
</head>
<body>
<main class="page">
  <div class="content">
    <h1>Будьте внимательны!</h1>
    <p>Регистрация для участия в проекте<br>и в событийных проектах не требуется.</p>
    <!-- Ссылка ведёт на главную страницу сайта; если пользователь пришёл с этого же сайта, вернёт его на предыдущую страницу -->
    <a class="back" id="back" href="/">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h9a5 5 0 0 1 0 10H9"/></svg>
      Вернуться обратно
    </a>
  </div>

  <svg class="blocks left" viewBox="0 0 434 129" aria-hidden="true">
    <rect x="0" y="85" width="434" height="44" fill="#8875E8"/>
    <rect x="71" y="0" width="85" height="85" fill="#B3AEFF"/>
    <path d="M205 0h167v86h-22a61 61 0 0 0-122 0h-23z" fill="#FF97A8"/>
  </svg>

  <svg class="blocks right" viewBox="0 0 312 292" aria-hidden="true">
    <rect x="0" y="250" width="312" height="42" fill="#8FD3FF"/>
    <path d="M135 79h126v171h-32V145a31 31 0 0 0-62 0v105h-32z" fill="#8875E8"/>
    <path d="M198 0 292 79H105z" fill="#FF97A8"/>
  </svg>
</main>
<script>
  document.getElementById('back').addEventListener('click', function (e) {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    } catch (err) {}
  });
</script>
</body>
</html>
